apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: threetier
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        env:
        # creds come from mongodb-secret, created by the pipeline from ADO secret vars
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: DATABASE_USER
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: DATABASE_PASSWORD
        ports:
        - containerPort: 27017
