apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-frontend
  namespace: threetier
spec:
  ingressClassName: nginx
  rules:
    # no host for now: reachable directly on the load balancer DNS name.
    # add "- host: <your-domain>" here once a domain points at the ELB.
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5000
